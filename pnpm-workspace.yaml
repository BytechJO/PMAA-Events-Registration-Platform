packages:
  - "apps/*"
  - "packages/*"

# One version of each shared tool for every package ("catalog:" in package.json).
catalog:
  "@eslint/js": ^9.39.0
  "@types/node": ^26.6.6
  eslint: ^9.39.5
  typescript: ^5.9.3
  typescript-eslint: ^8.74.0
  vitest: ^5.1.1
  zod: ^4.6.7

# Packages allowed to run install scripts (pnpm blocks the rest). CI fails if a new one appears unlisted.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
