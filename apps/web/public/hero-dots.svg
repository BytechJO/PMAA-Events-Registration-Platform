<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="5" fill="#9A62DE"/>
    </pattern>
    <linearGradient id="fade" x1="20" y1="20" x2="165" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity=".12"/>
    </linearGradient>
    <mask id="mask">
      <rect width="180" height="180" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="180" height="180" fill="url(#dots)" mask="url(#mask)" opacity=".72"/>
</svg>
